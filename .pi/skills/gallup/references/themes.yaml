domains:
  执行力:
    desc: 将想法转化为行动的能力，关注如何完成、组织、保障和修复
  影响力:
    desc: 影响他人、推动行动、掌控局面和赢得认可的能力
  关系建立:
    desc: 建立和深化人际关系、理解和连接他人的能力
  战略思维:
    desc: 分析信息、产生想法、学习吸收和规划未来的能力

themes:
  执行力:
    - en: Achiever
      zh: 成就
      desc: 你总想要有所成就。你的内在动力促使你追求杰出成果。
      traits: 永不满足的成就渴求 / 高度行动力，总是忙碌并高效工作 / 按结果衡量一切
      angle: 如何实现目标、完成任务
    - en: Arranger
      zh: 统筹
      desc: 你喜欢组织安排，善于将复杂情况变得井然有序。
      traits: 善于组织和协调资源 / 在混乱中建立秩序 / 灵活应对变化，保持高效
      angle: 如何组织安排、优化流程
    - en: Belief
      zh: 信仰
      desc: 你有核心价值观，这驱动你的决策和行为。
      traits: 坚定的核心价值观 / 追求意义和目的 / 无私奉献的精神
      angle: 这是否符合更高使命和价值观
    - en: Consistency
      zh: 公平
      desc: 你追求公平公正，期望所有人得到平等对待。
      traits: 追求公平和一致性 / 强调规则和标准 / 重视团队合作和平等待遇
      angle: 如何保持公平、遵循标准
    - en: Deliberative
      zh: 审慎
      desc: 你善于识别风险，做决定前会仔细考虑后果。
      traits: 谨慎小心，识别潜在风险 / 决策前深思熟虑 / 保护团队免受错误影响
      angle: 潜在风险和隐患
    - en: Discipline
      zh: 纪律
      desc: 你喜欢按结构化方式生活和工作，注重秩序和可预测性。
      traits: 重视结构和秩序 / 按计划执行，注重细节 / 追求可预测性和可靠性
      angle: 如何建立秩序、遵守纪律
    - en: Focus
      zh: 专注
      desc: 你善于确定方向，并持续朝目标前进。
      traits: 明确的目标导向 / 排除干扰，聚焦核心 / 按优先级排序任务
      angle: 核心目标是什么、如何保持专注
    - en: Responsibility
      zh: 责任
      desc: 你勇于承担后果，会一丝不苟完成任务。
      traits: 强烈的责任感 / 言出必行，值得信赖 / 追求承诺和可靠性
      angle: 如何承担责任、兑现承诺
    - en: Restorative
      zh: 排难
      desc: 你善于解决问题，能将缺陷恢复到最佳状态。
      traits: 善于解决问题和缺陷 / 面对挑战不退缩 / 追求完美，持续改进
      angle: 如何解决问题、修复缺陷
  影响力:
    - en: Activator
      zh: 行动
      desc: 你善于激励他人行动，推动事情发生。
      traits: 善于激励他人采取行动 / 推动事情发生和进展 / 不满足于现状，寻求突破
      angle: 如何推动行动、激励他人
    - en: Command
      zh: 统率
      desc: 你善于掌控局面，在压力下保持冷静。
      traits: 善于掌控局面 / 在压力下保持冷静和果断 / 敢于做出艰难决定
      angle: 如何在混乱中掌控局面、做决策
    - en: Communication
      zh: 沟通
      desc: 你善于用语言表达想法，能将复杂信息清晰传达。
      traits: 善于用语言表达想法 / 将复杂信息清晰传达 / 吸引他人注意力
      angle: 如何更好地表达和沟通
    - en: Competition
      zh: 竞争
      desc: 你追求卓越，总是与他人比较并渴望获胜。
      traits: 追求卓越和胜利 / 与他人比较，追求第一 / 被挑战激励
      angle: 如何获胜、如何超越他人
    - en: Maximizer
      zh: 完美
      desc: 你善于发挥优势，将好转化为杰出。
      traits: 善于发挥优势，追求卓越 / 将好转化为杰出 / 关注成长和提升
      angle: 如何发挥优势、做到最好
    - en: Self-Assurance
      zh: 自信
      desc: 你对自己的判断有信心，相信自己的价值观。
      traits: 对自己的判断有信心 / 相信自己的价值观和决定 / 不受他人影响
      angle: 如何相信自己、坚持自我
    - en: Significance
      zh: 追求
      desc: 你想要被认可，希望自己的贡献被看到。
      traits: 渴望被认可和重视 / 追求个人影响力和地位 / 希望贡献被看到
      angle: 如何获得认可、创造影响
    - en: Woo
      zh: 取悦
      desc: 你喜欢与陌生人建立联系，能快速赢得他人好感。
      traits: 善于与陌生人建立联系 / 快速赢得他人好感 / 喜欢结交新朋友
      angle: 如何赢得他人、建立人脉
  关系建立:
    - en: Adaptability
      zh: 适应
      desc: 你善于随遇而安，能在变化中保持灵活性。
      traits: 随遇而安，灵活应对变化 / 活在当下，接受现实 / 快速调整适应新情况
      angle: 如何适应变化、灵活应对
    - en: Connectedness
      zh: 关联
      desc: 你相信万物互联，善于将人与想法联系起来。
      traits: 相信万物互联 / 善于将人与想法联系起来 / 追求更深层次的意义
      angle: 如何建立联系、发现关联
    - en: Developer
      zh: 伯乐
      desc: 你善于发现他人潜力，喜欢帮助他人成长。
      traits: 善于发现他人潜力 / 喜欢帮助他人成长 / 看到别人的进步会感到满足
      angle: 如何帮助他人成长、发挥潜能
    - en: Empathy
      zh: 同理心
      desc: 你能设身处地理解他人感受，善于感知他人情绪。
      traits: 设身处地理解他人感受 / 善于感知他人情绪 / 理解他人的观点
      angle: 如何理解他人、换位思考
    - en: Harmony
      zh: 和谐
      desc: 你追求共识，善于避免冲突，寻求共同点。
      traits: 追求共识和一致 / 避免冲突，寻求共同点 / 创造和谐的工作环境
      angle: 如何达成共识、减少冲突
    - en: Includer
      zh: 包容
      desc: 你关注被边缘化的人，擅长让每个人都感到被接纳。
      traits: 关注被边缘化的人 / 让每个人都感到被接纳 / 扩大圈子，创造归属感
      angle: 如何包容他人、扩大圈子
    - en: Individualization
      zh: 个别
      desc: 你善于理解每个人独特之处，能因材施教。
      traits: 善于理解每个人独特之处 / 因材施教，发挥个人优势 / 看到每个人的独特价值
      angle: 如何因材施教、发挥个人优势
    - en: Positivity
      zh: 积极
      desc: 你总是积极向上，能激励他人并带来好心情。
      traits: 总是积极向上 / 激励他人，带来好心情 / 看到可能性和机会
      angle: 如何保持积极、激励他人
    - en: Relator
      zh: 交往
      desc: 你喜欢与熟悉的人建立深厚友谊，享受亲密关系。
      traits: 喜欢与熟悉的人建立深厚友谊 / 享受亲密关系 / 重视深度而非广度
      angle: 如何深化关系、建立信任
  战略思维:
    - en: Analytical
      zh: 分析
      desc: 你善于分析数据和情况，寻找逻辑和原因。
      traits: 善于分析数据和情况 / 寻找逻辑和原因 / 客观理性，重视证据
      angle: 如何分析情况、寻找原因
    - en: Context
      zh: 回顾
      desc: 你善于回顾过去，从历史经验中学习并寻找模式。
      traits: 善于回顾过去，从经验学习 / 寻找历史模式 / 理解当下与过去的联系
      angle: 过去有什么经验教训、如何从历史学习
    - en: Futuristic
      zh: 前瞻
      desc: 你具有远见，展望未来并描绘激动人心的愿景。
      traits: 具有远见，展望未来 / 描绘激动人心的愿景 / 看到可能性和机会
      angle: 未来的愿景是什么、如何实现
    - en: Ideation
      zh: 理念
      desc: 你善于产生新想法，能看到看似无关事物之间的联系。
      traits: 善于产生新想法 / 看到看似无关事物之间的联系 / 追求创新和突破
      angle: 有什么新想法、如何创新
    - en: Input
      zh: 搜集
      desc: 你喜欢收集信息、知识和其他资源以备将来使用。
      traits: 喜欢收集信息和知识 / 储备资源以备将来使用 / 归档整理，有序管理
      angle: 需要收集什么信息、如何有效储备
    - en: Intellection
      zh: 思维
      desc: 你喜欢深入思考，享受智力活动和精神交流。
      traits: 喜欢深入思考 / 享受智力活动和精神交流 / 追求思想和理解
      angle: 深入思考的角度、智力层面的分析
    - en: Learner
      zh: 学习
      desc: 你热爱学习，享受学习和成长过程本身。
      traits: 热爱学习和成长 / 享受学习过程 / 快速掌握新技能
      angle: 如何学习新知识、提升能力
    - en: Strategic
      zh: 战略
      desc: 你善于应对复杂情况，能找到最佳前进路线。
      traits: 善于应对复杂情况 / 找到最佳前进路线 / 看到多种可能性并选择最优
      angle: 如何分析情况、找到最佳方案
